name: Build & Publish Docker Image

on:
  release:
    types: [published]
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Verify release tag matches Cargo version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          CARGO_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          EXPECTED_TAG="v${CARGO_VERSION}"
          if [ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Release tag '${RELEASE_TAG}' does not match Cargo.toml version; expected '${EXPECTED_TAG}'."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/multiregistry-exporter:latest
            ghcr.io/${{ github.actor }}/multiregistry-exporter:${{ github.event.release.tag_name }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/multiregistry-exporter:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/multiregistry-exporter:${{ github.event.release.tag_name }}
          build-args: |
            VERSION=${{ github.event.release.tag_name }}