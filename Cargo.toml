[package]
name = "multiregistry-exporter"
version = "1.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["http1", "http2", "server", "service", "tokio"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"